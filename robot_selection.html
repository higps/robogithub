<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Selection Menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-top: #10233b;
            --bg-bottom: #214e6f;
            --panel: rgba(10, 20, 34, 0.78);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text: #f1f5f9;
            --muted: #bfd0df;
            --accent: #f1c86f;
            --free: #2fbf8f;
            --paid: #ff7a59;
            --boss: #f2b632;
            --card: rgba(255, 255, 255, 0.07);
            --card-hover: rgba(255, 255, 255, 0.12);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at top, rgba(241, 200, 111, 0.18), transparent 32%),
                linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            color: var(--muted);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            margin-bottom: 20px;
            background: var(--panel);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.18);
        }

        .status-copy {
            font-size: 0.96em;
            color: var(--muted);
        }

        .category-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: 12px 20px;
            font-size: 0.95em;
            font-weight: bold;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .category-btn.free {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .category-btn.free:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(17, 153, 142, 0.4);
        }

        .category-btn.paid {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .category-btn.paid:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(245, 87, 108, 0.4);
        }

        .category-btn.boss {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: #333;
        }

        .category-btn.boss:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(250, 112, 154, 0.4);
        }

        .category-btn.active {
            box-shadow: 0 0 20px currentColor;
        }

        .menu-container {
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            overflow: hidden;
            background: var(--panel);
            box-shadow: 0 18px 40px rgba(0,0,0,0.2);
            min-height: 300px;
            padding: 22px;
        }

        .robot-grid,
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .nav-tile {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-start;
            padding: 20px;
            border-radius: 16px;
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text);
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }

        .nav-tile:hover {
            transform: translateY(-2px);
            background: var(--card-hover);
            border-color: rgba(241, 200, 111, 0.4);
        }

        .nav-tile-title {
            font-size: 1.1em;
            font-weight: 700;
        }

        .nav-tile-count {
            font-size: 0.85em;
            color: var(--muted);
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 18px;
            font-size: 0.92em;
        }

        .breadcrumb-link {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 0.92em;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            font-family: inherit;
        }

        .breadcrumb-link:hover {
            text-decoration: underline;
        }

        .breadcrumb-current {
            color: var(--muted);
            font-weight: 600;
        }

        .breadcrumb-sep {
            color: var(--muted);
        }

        .robot-card {
            display: grid;
            grid-template-columns: 64px 1fr;
            gap: 14px;
            align-items: start;
            min-height: 148px;
            padding: 16px;
            border-radius: 16px;
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }

        .robot-card:hover {
            transform: translateY(-2px);
            background: var(--card-hover);
            border-color: rgba(241, 200, 111, 0.4);
        }

        .robot-image-placeholder {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            border: 1px dashed rgba(255, 255, 255, 0.35);
            background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72em;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .robot-card-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .robot-title {
            font-size: 1.06em;
            font-weight: 700;
            color: var(--text);
        }

        .robot-subtitle {
            font-size: 0.88em;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .robot-description {
            font-size: 0.92em;
            color: var(--text);
            line-height: 1.4;
            min-height: 2.6em;
            display: -webkit-box;
            line-clamp: 2;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .robot-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .robot-tag {
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 0.76em;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
        }

        .robot-meta {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.82em;
            color: var(--muted);
        }

        .no-data {
            padding: 56px 20px;
            text-align: center;
            color: var(--muted);
            font-size: 1em;
        }

        .no-data strong {
            display: block;
            margin-bottom: 8px;
            color: var(--text);
            font-size: 1.05em;
        }

        .timestamp {
            text-align: center;
            color: var(--muted);
            font-size: 0.9em;
            margin-top: 14px;
        }

        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 999px;
            font-size: 0.9em;
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        @media (max-width: 960px) {
            .robot-grid,
            .nav-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 16px;
            }

            .status-bar {
                flex-direction: column;
                align-items: flex-start;
            }

            .robot-grid,
            .nav-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Robot Selection</h1>
            <p>Auto-loaded robot roster from robot_selection.json</p>
        </div>

        <div class="status-bar">
            <div>
                <strong>Source:</strong>
                <span id="fileInfo" class="status-copy">Loading robot_selection.json...</span>
            </div>
            <div class="status-copy">Each card reserves a 64x64 image slot for future artwork.</div>
        </div>

        <div class="category-buttons">
            <button class="category-btn free active" data-category="free" onclick="switchCategory('free', this)">Free Robots</button>
            <button class="category-btn paid" data-category="paid" onclick="switchCategory('paid', this)">Paid Robots</button>
            <button class="category-btn boss" data-category="bosses" onclick="switchCategory('bosses', this)">Bosses</button>
        </div>

        <div class="menu-container" id="menuContainer">
            <div class="no-data"><strong>Loading robots...</strong>Please wait while the JSON file is read.</div>
        </div>

        <div class="stats" id="stats"></div>
        <div class="timestamp" id="timestamp"></div>
    </div>

    <script>
        let robotData = null;
        let currentCategory = 'free';
        let currentRole = null;
        let currentSubclass = null;

        const categoryLabels = {
            free: 'Free Robots',
            paid: 'Paid Robots',
            bosses: 'Bosses'
        };

        loadRobotData();

        async function loadRobotData() {
            try {
                robotData = await fetchJsonViaFetch('./robot_selection.json');
            } catch (fetchError) {
                try {
                    robotData = await fetchJsonViaXhr('./robot_selection.json');
                } catch (xhrError) {
                    showLoadError(xhrError.message || fetchError.message);
                    return;
                }
            }

            document.getElementById('fileInfo').textContent = 'Loaded robot_selection.json';
            updateTimestamp();
            render();
        }

        async function fetchJsonViaFetch(url) {
            const response = await fetch(url, { cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            return response.json();
        }

        function fetchJsonViaXhr(url) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.onreadystatechange = function () {
                    if (xhr.readyState !== 4) {
                        return;
                    }

                    // file:// requests report status 0 on success in some browsers.
                    if (xhr.status === 0 || xhr.status === 200) {
                        try {
                            resolve(JSON.parse(xhr.responseText));
                        } catch (parseError) {
                            reject(parseError);
                        }
                    } else {
                        reject(new Error(`HTTP ${xhr.status}`));
                    }
                };
                xhr.onerror = function () {
                    reject(new Error('Network error while loading robot_selection.json'));
                };
                xhr.send();
            });
        }

        function showLoadError(message) {
            document.getElementById('fileInfo').textContent = 'Failed to load robot_selection.json';
            document.getElementById('menuContainer').innerHTML = `
                <div class="no-data">
                    <strong>Could not load robot_selection.json</strong>
                    <div>${escapeHtml(message)}</div>
                    <div style="margin-top: 10px;">
                        Browsers block direct file:// access to local JSON files for security reasons.
                        Serve this folder with a local web server instead, for example:
                        <code>python -m http.server</code> then open http://localhost:8000/robot_selection.html,
                        or use VS Code's "Live Server" extension.
                    </div>
                </div>
            `;
            document.getElementById('stats').innerHTML = '';
            document.getElementById('timestamp').textContent = '';
        }

        function switchCategory(category, button) {
            currentCategory = category;
            currentRole = null;
            currentSubclass = null;

            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            if (button) {
                button.classList.add('active');
            }

            render();
        }

        function selectRole(roleName) {
            currentRole = roleName;
            currentSubclass = null;
            render();
        }

        function selectSubclass(subclassName) {
            currentSubclass = subclassName;
            render();
        }

        function goToCategoryRoot() {
            currentRole = null;
            currentSubclass = null;
            render();
        }

        function goToRoleRoot() {
            currentSubclass = null;
            render();
        }

        function updateTimestamp() {
            if (!robotData || !robotData.timestamp) return;

            const date = new Date(robotData.timestamp * 1000);
            document.getElementById('timestamp').textContent =
                `Updated: ${date.toLocaleString()}`;
        }

        function countRoleRobots(roleData) {
            return Object.values(roleData).reduce((sum, subclassData) => {
                return sum + (Array.isArray(subclassData?.robots) ? subclassData.robots.length : 0);
            }, 0);
        }

        function render() {
            const container = document.getElementById('menuContainer');

            if (!robotData) {
                container.innerHTML = '<div class="no-data"><strong>No robot data loaded</strong></div>';
                updateStats('', 0, 'Robots');
                return;
            }

            if (currentCategory === 'bosses') {
                const robots = robotData.bosses?.robots || [];
                const breadcrumb = renderBreadcrumb([{ label: categoryLabels.bosses }]);
                container.innerHTML = breadcrumb + renderRobotsSection(robots);
                updateStats(categoryLabels.bosses, robots.length, 'Robots');
                return;
            }

            const categoryData = robotData.categories?.[currentCategory];

            if (!categoryData) {
                container.innerHTML = '<div class="no-data"><strong>No data available</strong>This category is empty.</div>';
                updateStats(categoryLabels[currentCategory] || currentCategory, 0, 'Robots');
                return;
            }

            if (!currentRole) {
                const roleNames = Object.keys(categoryData);
                const breadcrumb = renderBreadcrumb([{ label: categoryLabels[currentCategory] }]);
                container.innerHTML = breadcrumb + renderRoleGrid(categoryData, roleNames);
                updateStats(categoryLabels[currentCategory], roleNames.length, 'Roles');
                return;
            }

            const roleData = categoryData[currentRole];

            if (!roleData) {
                goToCategoryRoot();
                return;
            }

            const subclassNames = Object.keys(roleData);
            const hasOnlyMatchingSubclass = subclassNames.length === 1 && subclassNames[0] === currentRole;

            if (hasOnlyMatchingSubclass) {
                const robots = roleData[currentRole]?.robots || [];
                const breadcrumb = renderBreadcrumb([
                    { label: categoryLabels[currentCategory], action: 'goToCategoryRoot' },
                    { label: currentRole }
                ]);
                container.innerHTML = breadcrumb + renderRobotsSection(robots);
                updateStats(currentRole, robots.length, 'Robots');
                return;
            }

            if (!currentSubclass) {
                const breadcrumb = renderBreadcrumb([
                    { label: categoryLabels[currentCategory], action: 'goToCategoryRoot' },
                    { label: currentRole }
                ]);
                container.innerHTML = breadcrumb + renderSubclassGrid(roleData, subclassNames);
                updateStats(currentRole, subclassNames.length, 'Subclasses');
                return;
            }

            const subclassData = roleData[currentSubclass];
            const robots = subclassData?.robots || [];
            const breadcrumb = renderBreadcrumb([
                { label: categoryLabels[currentCategory], action: 'goToCategoryRoot' },
                { label: currentRole, action: 'goToRoleRoot' },
                { label: currentSubclass }
            ]);
            container.innerHTML = breadcrumb + renderRobotsSection(robots);
            updateStats(currentSubclass, robots.length, 'Robots');
        }

        function renderBreadcrumb(steps) {
            const parts = steps.map((step, index) => {
                const isLast = index === steps.length - 1;
                if (isLast || !step.action) {
                    return `<span class="breadcrumb-current">${escapeHtml(step.label)}</span>`;
                }
                return `<button type="button" class="breadcrumb-link" onclick="${step.action}()">${escapeHtml(step.label)}</button>`;
            });

            return `<div class="breadcrumb">${parts.join('<span class="breadcrumb-sep">›</span>')}</div>`;
        }

        function renderRoleGrid(categoryData, roleNames) {
            const tiles = roleNames.map(roleName => {
                const count = countRoleRobots(categoryData[roleName]);
                return `
                    <button type="button" class="nav-tile" onclick="selectRole('${escapeJs(roleName)}')">
                        <span class="nav-tile-title">${escapeHtml(roleName)}</span>
                        <span class="nav-tile-count">${count} robot${count === 1 ? '' : 's'}</span>
                    </button>
                `;
            }).join('');

            return `<div class="nav-grid">${tiles}</div>`;
        }

        function renderSubclassGrid(roleData, subclassNames) {
            const tiles = subclassNames.map(subclassName => {
                const count = Array.isArray(roleData[subclassName]?.robots) ? roleData[subclassName].robots.length : 0;
                return `
                    <button type="button" class="nav-tile" onclick="selectSubclass('${escapeJs(subclassName)}')">
                        <span class="nav-tile-title">${escapeHtml(subclassName)}</span>
                        <span class="nav-tile-count">${count} robot${count === 1 ? '' : 's'}</span>
                    </button>
                `;
            }).join('');

            return `<div class="nav-grid">${tiles}</div>`;
        }

        function renderRobotsSection(robots) {
            if (!robots.length) {
                return '<div class="no-data"><strong>No robots found</strong>This section has no entries to display.</div>';
            }

            return `<div class="robot-grid">${renderRobotsGrid(robots)}</div>`;
        }

        function renderRobotsGrid(robots) {
            return robots.map(robot => {
                const description = robot.description || 'No description available.';
                const subclass = robot.subclass && robot.subclass !== robot.role ? robot.subclass : null;
                const tags = [robot.class, robot.role, subclass].filter(Boolean)
                    .map(value => `<span class="robot-tag">${escapeHtml(value)}</span>`)
                    .join('');

                return `
                    <article class="robot-card">
                        <div class="robot-image-placeholder">64 x 64</div>
                        <div class="robot-card-body">
                            <div>
                                <div class="robot-title">${escapeHtml(robot.name || 'Unnamed Robot')}</div>
                                <div class="robot-subtitle">${escapeHtml((robot.class || 'Unknown Class') + ' Robot')}</div>
                            </div>
                            <div class="robot-description">${escapeHtml(description)}</div>
                            <div class="robot-tags">${tags}</div>
                            <div class="robot-meta">
                                <span>Health: ${formatNumber(robot.health)}</span>
                                <span>Difficulty: ${formatNumber(robot.difficulty)}</span>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function formatNumber(value) {
            return typeof value === 'number' ? value.toLocaleString() : 'N/A';
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function escapeJs(value) {
            return String(value)
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'");
        }

        function updateStats(label, count, countLabel) {
            const statsEl = document.getElementById('stats');
            statsEl.innerHTML = `
                <div class="stat-item">📊 <strong>${escapeHtml(label || '')}</strong></div>
                <div class="stat-item">🤖 ${escapeHtml(countLabel || 'Robots')}: <strong>${count}</strong></div>
            `;
        }
    </script>
</body>
</html>
